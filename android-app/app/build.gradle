plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.kr0.goldendaughter'
    compileSdk 36

    defaultConfig {
        applicationId 'kr.kr0.goldendaughter'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '1.0.2'
    }

    signingConfigs {
        release {
            storeFile new File(System.getProperty('user.home'), '.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
